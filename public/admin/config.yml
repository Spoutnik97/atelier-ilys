backend:
  name: github
  repo: Spoutnik97/atelier-ilys
  branch: main
  base_url: https://www.atelier-ilys.com
  auth_endpoint: api/auth

media_folder: public/images
public_folder: /images

locale: fr

collections:
  - name: calendar
    label: Calendrier des stages
    files:
      - label: Stages 2026
        name: "2026"
        file: src/content/calendar/2026.yaml
        fields:
          - label: Stages
            name: events
            widget: list
            summary: "{{fields.startDate}} — {{fields.title}}"
            fields:
              - label: Date(s) du stage
                name: startDate
                widget: string
                hint: "Ex: 2026-07-17 ou 2026-07-17/18 ou 2026-07-29/30/31"
              - label: Titre du stage
                name: title
                widget: string
              - label: Type de stage
                name: type
                widget: string
                hint: "Ex: indigo, teinture, ecoprint, beauxarts, teinture - ecoprint"
              - label: Description
                name: description
                widget: text
                required: false
              - label: Tarif
                name: price
                widget: string
                required: false
                hint: "Ex: 220 € les 2 jours, repas non compris"
              - label: Titre en anglais
                name: titleEn
                widget: string
                required: false
                hint: "Affiché sur la version anglaise du site. Laisser vide = titre français."
              - label: Description en anglais
                name: descriptionEn
                widget: text
                required: false
              - label: Tarif en anglais
                name: priceEn
                widget: string
                required: false
                hint: "Ex: €220 for 2 days, meals not included"
              - label: Nombre de places
                name: spots
                widget: number
                required: false
                value_type: int
                min: 1
                max: 30
